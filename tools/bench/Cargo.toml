[package]
name = "hushtype-bench"
description = "Benchmark and diagnostics CLI for the HushType speech engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hushtype-engine = { path = "../../crates/engine" }
hushtype-text = { path = "../../crates/text" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
