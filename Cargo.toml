[workspace]
resolver = "2"
members = ["crates/text", "crates/engine", "crates/platform", "apps/desktop/src-tauri", "tools/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HushType contributors"]
repository = "https://github.com/Hemaditya05/HushType"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# whisper.cpp / audio code is painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
